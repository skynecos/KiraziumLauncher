name: Apply MobileGlues patch

on:
  push:
    branches:
      - feature/mobileglues-renderer

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply MobileGlues renderer patch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/mobileglues-renderer
          fetch-depth: 0
          submodules: recursive

      - name: Apply minimal MobileGlues integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"Pattern not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app_pojavlauncher/build.gradle',
              '    implementation project(":sdl:jni_bindings")\n',
              '    implementation project(":sdl:jni_bindings")\n    implementation project(":MobileGlues")\n'
          )

          replace_once(
              'app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/JREUtils.java',
              '        setupAngleEnv(context, envMap);\n        setupFfmpegEnv(context, envMap);\n        // Init mesa renderers\n',
              '        setupAngleEnv(context, envMap);\n        setupFfmpegEnv(context, envMap);\n\n        if ("opengles_mobileglues".equals(renderer)) {\n            envMap.put("MG_DIR_PATH", Tools.DIR_DATA + "/MobileGlues");\n        }\n\n        // Init mesa renderers\n'
          )

          replace_once(
              'app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/JREUtils.java',
              '            case "opengles3_ltw" :\n                renderLibrary = "libltw.so";\n                useGles = true;\n                glesVersion = 3;\n                break;\n            case "opengles2":\n',
              '            case "opengles3_ltw" :\n                renderLibrary = "libltw.so";\n                useGles = true;\n                glesVersion = 3;\n                break;\n            case "opengles_mobileglues" :\n                renderLibrary = "libmobileglues.so";\n                useGles = true;\n                glesVersion = 3;\n                break;\n            case "opengles2":\n'
          )

          replace_once(
              'app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/RendererCompatUtil.java',
              '        boolean appHasLtw = new File(Tools.NATIVE_LIB_DIR, "libltw.so").exists();\n',
              '        boolean appHasLtw = new File(Tools.NATIVE_LIB_DIR, "libltw.so").exists();\n        boolean appHasMobileGlues = new File(Tools.NATIVE_LIB_DIR, "libmobileglues.so").exists();\n'
          )

          replace_once(
              'app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/RendererCompatUtil.java',
              '            if(rendererId.contains("ltw") && (!deviceHasOpenGLES3 || !appHasLtw)) continue;\n            rendererIds.add(rendererId);\n',
              '            if(rendererId.contains("ltw") && (!deviceHasOpenGLES3 || !appHasLtw)) continue;\n            if(rendererId.contains("mobileglues") && (!deviceHasOpenGLES3 || !appHasMobileGlues)) continue;\n            rendererIds.add(rendererId);\n'
          )

          replace_once(
              '.github/workflows/android.yml',
              '          sha256sum quota-safe-release/KiraziumLauncher-Unsigned-CI.apk > quota-safe-release/SHA256SUMS.txt\n          sha256sum -c quota-safe-release/SHA256SUMS.txt\n',
              '          (\n            cd quota-safe-release\n            sha256sum KiraziumLauncher-Unsigned-CI.apk > SHA256SUMS.txt\n            sha256sum -c SHA256SUMS.txt\n          )\n'
          )
          PY

          if [ ! -d MobileGlues/.git ]; then
            rm -rf MobileGlues
            git clone --recurse-submodules https://github.com/MobileGL-Dev/MobileGlues.git MobileGlues
          fi
          git -C MobileGlues fetch origin f56af31d3e490d95808b3adc4ace20234249a37a
          git -C MobileGlues checkout --detach f56af31d3e490d95808b3adc4ace20234249a37a
          git -C MobileGlues submodule update --init --recursive
          git add MobileGlues

      - name: Commit patch
        run: |
          set -euo pipefail
          git add .gitmodules settings.gradle app_pojavlauncher .github/workflows/android.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: apply MobileGlues renderer patch"
          git push origin HEAD:feature/mobileglues-renderer
