name: Kirazium Fast Signed Stallfix Test APK

on:
  push:
    branches:
      - codex/embedded-ffmpeg-single-apk
    paths:
      - ".github/workflows/quick-signed-stallfix-test.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_KIRAZIUM_CERT_SHA256: "206d0a623973d12b6f50f147d6e9417c164f3b66a30ce1f418c34940e94bb755"
  EXPECTED_KIRAZIUM_KEYSTORE_SHA256: "c28442da2dbbc2b49df476077f5959b7970c3116b71e7929835dec39a9df93f5"
  VERIFIED_FFMPEG_APK_COMMIT: "e7f3d5eb2c6c114caada59c5c3f561c2d470a789"

jobs:
  build-fast-signed:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout current Kirazium launcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Restore exact phone-tested embedded FFmpeg bundle
        run: |
          set -euo pipefail
          BASE_APK="$RUNNER_TEMP/verified-embedded-ffmpeg.apk"
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/skynecos/KiraziumLauncher/${VERIFIED_FFMPEG_APK_COMMIT}/artifacts/KiraziumLauncher-SingleAPK-EmbeddedFFmpeg-SIGNED.apk" \
            -o "$BASE_APK"
          test -s "$BASE_APK"
          EXTRACTED="$RUNNER_TEMP/verified-native"
          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          unzip -q "$BASE_APK" 'lib/arm64-v8a/*.so' -d "$EXTRACTED"
          JNI_DIR="app_pojavlauncher/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"
          python3 - "$EXTRACTED/lib/arm64-v8a" "$JNI_DIR" <<'PY'
          import pathlib, re, shutil, subprocess, sys
          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])
          system = {
              'libc.so','libm.so','libdl.so','liblog.so','libandroid.so','libmediandk.so','libcamera2ndk.so',
              'libz.so','libOpenSLES.so','libaaudio.so','libEGL.so','libGLESv2.so','libGLESv3.so',
              'libjnigraphics.so','libvulkan.so','libstdc++.so','libgcc.so'
          }
          roots = ['libffmpeg.so','libffprobe.so','libavformat.so','libavcodec.so','libavdevice.so','libavutil.so']
          todo = [x for x in roots if (src / x).is_file()]
          if len(todo) != len(roots):
              raise SystemExit('Verified APK is missing required FFmpeg roots')
          seen = set()
          while todo:
              name = todo.pop()
              if name in seen: continue
              seen.add(name)
              p = src / name
              if not p.is_file(): raise SystemExit(f'Missing FFmpeg dependency: {name}')
              out = subprocess.check_output(['readelf','-d',str(p)], text=True, errors='replace')
              for dep in re.findall(r'\(NEEDED\).*?\[(.*?)\]', out):
                  if dep in system or dep in seen: continue
                  if not (src / dep).is_file(): raise SystemExit(f'{name} needs unpackaged dependency {dep}')
                  todo.append(dep)
          for name in sorted(seen):
              target = dst / name
              if target.exists(): target.unlink()
              shutil.copy2(src / name, target)
          print(f'Restored {len(seen)} verified FFmpeg-family native libraries.')
          PY
          if ! grep -Fq 'Using embedded Kirazium FFmpeg:' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/JREUtils.java; then
            python3 tools/embedded-ffmpeg/patch-launcher.py
          fi
          test -s "$JNI_DIR/libffmpeg.so"
          test -s "$JNI_DIR/libavcodec.so"
          strings "$JNI_DIR/libavformat.so" | grep -q -- '--enable-gnutls'
          strings "$JNI_DIR/libavcodec.so" | grep -q -- '--enable-jni'

      - name: Get LTW renderer
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          commit: 3aca75d9f3f05afd0b02a3d8f686084d968fa200
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Build current full release APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullRelease --stacktrace
          APK="$(find app_pojavlauncher/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          mkdir -p unsigned out verify
          cp "$APK" unsigned/KiraziumLauncher-latest-unsigned.apk
          unzip -p "$APK" lib/arm64-v8a/libffmpeg.so > verify/libffmpeg.so
          test -s verify/libffmpeg.so
          found=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -Fq 'Using embedded Kirazium FFmpeg:'; then found=1; break; fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          test "$found" = 1

      - name: Prepare and verify Kirazium production signing key
        env:
          KIRAZIUM_KEYSTORE_B64: ${{ secrets.KIRAZIUM_KEYSTORE_B64 }}
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KIRAZIUM_KEYSTORE_B64:-}"
          test -n "${KIRAZIUM_KEYSTORE_PASSWORD:-}"
          SIGNING_DIR="$RUNNER_TEMP/kirazium-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          printf '%s' "$KIRAZIUM_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$SIGNING_DIR/kirazium-release.jks"
          chmod 600 "$SIGNING_DIR/kirazium-release.jks"
          test "$(sha256sum "$SIGNING_DIR/kirazium-release.jks" | awk '{print $1}')" = "$EXPECTED_KIRAZIUM_KEYSTORE_SHA256"
          PASS="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          OUT="$(keytool -list -v -keystore "$SIGNING_DIR/kirazium-release.jks" -storepass "$PASS" -alias kirazium 2>/dev/null)"
          CERT="$(printf '%s\n' "$OUT" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$CERT" = "$EXPECTED_KIRAZIUM_CERT_SHA256"

      - name: Sign and verify latest APK
        env:
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          PASS="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export KIRAZIUM_SIGNING_PASSWORD="$PASS"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/kirazium-signing/kirazium-release.jks" \
            --ks-key-alias kirazium \
            --ks-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --key-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --out out/KiraziumLauncher-Latest-StallfixTest-SIGNED.apk \
            unsigned/KiraziumLauncher-latest-unsigned.apk
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs out/KiraziumLauncher-Latest-StallfixTest-SIGNED.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"
          CERT="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/{v=$NF; gsub(":", "", v); print tolower(v); exit}')"
          test "$CERT" = "$EXPECTED_KIRAZIUM_CERT_SHA256"
          sha256sum out/KiraziumLauncher-Latest-StallfixTest-SIGNED.apk > out/KiraziumLauncher-Latest-StallfixTest-SIGNED.apk.sha256

      - name: Publish test APK to isolated build branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/stallfix-test-stage"
          output="$RUNNER_TEMP/stallfix-test-output"
          mkdir -p "$staged"
          cp out/* "$staged/"
          git worktree add --detach "$output" "$GITHUB_SHA"
          cd "$output"
          git switch --orphan kirazium-stallfix-test-build
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p artifacts
          cp "$staged"/* artifacts/
          printf 'source_commit=%s\nworkflow=quick-signed-stallfix-test\nffmpeg_source_apk_commit=%s\nsigning=production\ndreamdisplays_install=manual-stallfix1\n' "$GITHUB_SHA" "$VERIFIED_FFMPEG_APK_COMMIT" > artifacts/BUILD_INFO.txt
          git add artifacts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: latest signed Kirazium stallfix test APK'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/kirazium-stallfix-test-build

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/kirazium-signing"
