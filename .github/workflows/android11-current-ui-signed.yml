name: Kirazium Android11 HW Decode Current UI Signed

on:
  push:
    branches:
      - codex/android11-hwdecode-current-ui
    paths:
      - ".github/workflows/android11-current-ui-signed.yml"
      - "app_pojavlauncher/src/main/jni/android_art_vm_bridge.c"
      - "app_pojavlauncher/src/main/jni/CMakeLists.txt"
      - "app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/MainMenuFragment.java"
      - "app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/MrpackInstaller.java"
      - "app_pojavlauncher/src/main/res/layout/item_modpack_button.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      EXPECTED_KIRAZIUM_CERT_SHA256: "206d0a623973d12b6f50f147d6e9417c164f3b66a30ce1f418c34940e94bb755"
      EXPECTED_KIRAZIUM_KEYSTORE_SHA256: "c28442da2dbbc2b49df476077f5959b7970c3116b71e7929835dec39a9df93f5"
    steps:
      - name: Checkout current launcher baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Verify current launcher features are preserved
        run: |
          set -euo pipefail
          test -s app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/utils/MrpackInstaller.java
          test -s app_pojavlauncher/src/main/res/layout/item_modpack_button.xml
          grep -F 'installModpackButton' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/MainMenuFragment.java >/dev/null
          grep -F 'OpenDocumentWithExtension("mrpack")' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/fragments/MainMenuFragment.java >/dev/null

      - name: Get LTW renderer
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          commit: 3aca75d9f3f05afd0b02a3d8f686084d968fa200
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android11 current-UI launcher APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullRelease --stacktrace

      - name: Verify ART JavaVM bridge
        run: |
          set -euo pipefail
          APK="$(find app_pojavlauncher/build/outputs/apk/full/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          mkdir -p verify unsigned out
          unzip -p "$APK" lib/arm64-v8a/libpojavexec.so > verify/libpojavexec.so
          test -s verify/libpojavexec.so
          readelf -Ws verify/libpojavexec.so | grep -F 'kirazium_get_android_art_vm' >/dev/null
          strings verify/libpojavexec.so | grep -F 'KIRAZIUM_ANDROID_ART_VM' >/dev/null
          strings verify/libpojavexec.so | grep -F 'Published Android ART JavaVM for DreamDisplays MediaCodec' >/dev/null
          cp "$APK" unsigned/KiraziumLauncher-Android11-CurrentUI-unsigned.apk

      - name: Prepare and verify Kirazium signing key
        env:
          KIRAZIUM_KEYSTORE_B64: ${{ secrets.KIRAZIUM_KEYSTORE_B64 }}
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KIRAZIUM_KEYSTORE_B64:-}"
          test -n "${KIRAZIUM_KEYSTORE_PASSWORD:-}"
          SIGNING_DIR="$RUNNER_TEMP/kirazium-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          printf '%s' "$KIRAZIUM_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$SIGNING_DIR/kirazium-release.jks"
          chmod 600 "$SIGNING_DIR/kirazium-release.jks"
          ACTUAL_KEYSTORE_SHA256="$(sha256sum "$SIGNING_DIR/kirazium-release.jks" | awk '{print $1}')"
          test "$ACTUAL_KEYSTORE_SHA256" = "$EXPECTED_KIRAZIUM_KEYSTORE_SHA256"
          SIGNING_PASSWORD="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEYTOOL_OUTPUT="$(keytool -list -v -keystore "$SIGNING_DIR/kirazium-release.jks" -storepass "$SIGNING_PASSWORD" -alias kirazium 2>/dev/null)"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$KEYTOOL_OUTPUT" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_KIRAZIUM_CERT_SHA256"

      - name: Sign and verify current-UI launcher
        env:
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNING_PASSWORD="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export KIRAZIUM_SIGNING_PASSWORD="$SIGNING_PASSWORD"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/kirazium-signing/kirazium-release.jks" \
            --ks-key-alias kirazium \
            --ks-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --key-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --out out/KiraziumLauncher-Android11-HWDecode-CurrentUI-SIGNED.apk \
            unsigned/KiraziumLauncher-Android11-CurrentUI-unsigned.apk
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs out/KiraziumLauncher-Android11-HWDecode-CurrentUI-SIGNED.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"
          SIGNED_CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/{value=$NF; gsub(":", "", value); print tolower(value); exit}')"
          test "$SIGNED_CERT_SHA256" = "$EXPECTED_KIRAZIUM_CERT_SHA256"
          sha256sum out/KiraziumLauncher-Android11-HWDecode-CurrentUI-SIGNED.apk > out/KiraziumLauncher-Android11-HWDecode-CurrentUI-SIGNED.apk.sha256

      - name: Publish signed current-UI Android11 launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/android11-current-ui-stage"
          output="$RUNNER_TEMP/android11-current-ui-output"
          mkdir -p "$staged"
          cp out/* "$staged/"
          git worktree add --detach "$output" "$GITHUB_SHA"
          cd "$output"
          git switch --orphan android11-hwdecode-current-ui-signed-build
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p artifacts
          cp "$staged"/* artifacts/
          printf 'source_commit=%s\nsource_branch=codex/android11-hwdecode-current-ui\nworkflow=android11-current-ui-signed\n' "$GITHUB_SHA" > artifacts/BUILD_INFO.txt
          git add artifacts
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build: signed Android11 hardware decode on current launcher UI"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/android11-hwdecode-current-ui-signed-build

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/kirazium-signing"
