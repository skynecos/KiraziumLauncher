name: Kirazium Sign Current CI APK

on:
  push:
    branches:
      - codex/embedded-ffmpeg-single-apk
    paths:
      - ".github/workflows/sign-current-ci-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_SOURCE_COMMIT: "8070e375621c12bad4e160e222452bab52bf2d37"
  EXPECTED_KIRAZIUM_CERT_SHA256: "206d0a623973d12b6f50f147d6e9417c164f3b66a30ce1f418c34940e94bb755"
  EXPECTED_KIRAZIUM_KEYSTORE_SHA256: "c28442da2dbbc2b49df476077f5959b7970c3116b71e7929835dec39a9df93f5"

jobs:
  sign-current-ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact verified CI APK for current app source
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ci-apk"
          rm -rf "$stage"
          for attempt in $(seq 1 60); do
            rm -rf "$stage"
            if git clone --depth 1 --branch kirazium-launcher-ci-build \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$stage" >/dev/null 2>&1; then
              actual="$(awk -F= '$1 == "source_commit" {print $2; exit}' "$stage/artifacts/BUILD_INFO.txt" 2>/dev/null || true)"
              if [ "$actual" = "$EXPECTED_SOURCE_COMMIT" ]; then
                break
              fi
            fi
            sleep 5
          done
          actual="$(awk -F= '$1 == "source_commit" {print $2; exit}' "$stage/artifacts/BUILD_INFO.txt" 2>/dev/null || true)"
          if [ "$actual" != "$EXPECTED_SOURCE_COMMIT" ]; then
            echo "::error::Expected CI APK source $EXPECTED_SOURCE_COMMIT, got $actual"
            exit 1
          fi
          (cd "$stage/artifacts" && sha256sum -c SHA256SUMS.txt)
          test -s "$stage/artifacts/KiraziumLauncher-Unsigned-CI.apk"
          mkdir -p unsigned out
          cp "$stage/artifacts/KiraziumLauncher-Unsigned-CI.apk" unsigned/KiraziumLauncher-Unsigned-CI.apk

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare and verify Kirazium production signing key
        env:
          KIRAZIUM_KEYSTORE_B64: ${{ secrets.KIRAZIUM_KEYSTORE_B64 }}
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KIRAZIUM_KEYSTORE_B64:-}"
          test -n "${KIRAZIUM_KEYSTORE_PASSWORD:-}"
          SIGNING_DIR="$RUNNER_TEMP/kirazium-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          printf '%s' "$KIRAZIUM_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$SIGNING_DIR/kirazium-release.jks"
          chmod 600 "$SIGNING_DIR/kirazium-release.jks"
          test "$(sha256sum "$SIGNING_DIR/kirazium-release.jks" | awk '{print $1}')" = "$EXPECTED_KIRAZIUM_KEYSTORE_SHA256"
          PASS="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          OUT="$(keytool -list -v -keystore "$SIGNING_DIR/kirazium-release.jks" -storepass "$PASS" -alias kirazium 2>/dev/null)"
          CERT="$(printf '%s\n' "$OUT" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$CERT" = "$EXPECTED_KIRAZIUM_CERT_SHA256"

      - name: Sign and verify production APK
        env:
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          PASS="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export KIRAZIUM_SIGNING_PASSWORD="$PASS"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/kirazium-signing/kirazium-release.jks" \
            --ks-key-alias kirazium \
            --ks-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --key-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --out out/KiraziumLauncher-Latest-StallfixTest-SIGNED.apk \
            unsigned/KiraziumLauncher-Unsigned-CI.apk
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs out/KiraziumLauncher-Latest-StallfixTest-SIGNED.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"
          CERT="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/{v=$NF; gsub(":", "", v); print tolower(v); exit}')"
          test "$CERT" = "$EXPECTED_KIRAZIUM_CERT_SHA256"
          sha256sum out/KiraziumLauncher-Latest-StallfixTest-SIGNED.apk > out/KiraziumLauncher-Latest-StallfixTest-SIGNED.apk.sha256

      - name: Publish signed test APK to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/signed-stage"
          output="$RUNNER_TEMP/signed-output"
          mkdir -p "$staged"
          cp out/* "$staged/"
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" "$output"
          cd "$output"
          git switch --orphan kirazium-stallfix-test-build
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p artifacts
          cp "$staged"/* artifacts/
          printf 'source_commit=%s\nworkflow=sign-current-ci-apk\nsigning=production\ndreamdisplays_install=manual-stallfix1\n' "$EXPECTED_SOURCE_COMMIT" > artifacts/BUILD_INFO.txt
          git add artifacts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: production-signed latest Kirazium stallfix test APK'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/kirazium-stallfix-test-build

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/kirazium-signing"
