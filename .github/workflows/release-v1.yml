name: Kirazium Launcher 1.0 Release

on:
  push:
    branches:
      - v3_openjdk
    paths:
      - '.github/workflows/release-v1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get LTW renderer
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullDebug --stacktrace
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/KiraziumLauncher-1.0.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 out/KiraziumLauncher-1.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kirazium Launcher 1.0" \
            --notes "Kirazium Launcher 1.0\n\nİlk genel sürüm.\n\n- Kirazium hazır profili\n- Düşük Grafik / FPS Boost modu\n- %80 düşük grafik çözünürlüğü\n- 60 FPS düşük grafik limiti\n- Texture Packleri menüsü ve Modrinth entegrasyonu\n- play.kirazium.com sunucu entegrasyonu"
