name: Kirazium Anizium Subtitle Capture

on:
  workflow_dispatch:
  push:
    branches:
      - codex/anizium-subtitle-capture
    paths:
      - 'tools/anizium-subtitle-capture/**'
      - '.github/workflows/anizium-subtitle-capture.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p tools/anizium-subtitle-capture :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp tools/anizium-subtitle-capture/app/build/outputs/apk/debug/app-debug.apk Kirazium-Anizium-Subtitle-Capture-v0.1.apk
          sha256sum Kirazium-Anizium-Subtitle-Capture-v0.1.apk > Kirazium-Anizium-Subtitle-Capture-v0.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kirazium-Anizium-Subtitle-Capture
          path: |
            Kirazium-Anizium-Subtitle-Capture-v0.1.apk
            Kirazium-Anizium-Subtitle-Capture-v0.1.apk.sha256
          if-no-files-found: error
