name: Kirazium Dream Displays Android Mod

on:
  push:
    branches:
      - codex/dreamdisplays-ffmpeg
    paths:
      - ".github/workflows/dreamdisplays-android.yml"
      - "tools/dreamdisplays-android/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DREAMDISPLAYS_UPSTREAM_COMMIT: "bb5e1457bd4717561d367b329440e507878748e1"
  ANDROID_NDK_VERSION: "25.1.8937393"

jobs:
  build-fabric-26-1-2:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Kirazium patch files
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Fetch Dream Displays 1.9.5 source
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dreamdisplays"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/arnodoelinger/dreamdisplays.git
          git -C "$SRC" fetch --depth 1 origin "$DREAMDISPLAYS_UPSTREAM_COMMIT"
          git -C "$SRC" checkout --detach FETCH_HEAD
          cp tools/dreamdisplays-android/apply-patches.py "$SRC/apply-kirazium-android-patches.py"
          cp tools/dreamdisplays-android/apply-android4.py "$SRC/apply-kirazium-android4.py"
          cp tools/dreamdisplays-android/apply-android5.py "$SRC/apply-kirazium-android5.py"
          cp tools/dreamdisplays-android/apply-android6.py "$SRC/apply-kirazium-android6.py"
          cp tools/dreamdisplays-android/apply-android7.py "$SRC/apply-kirazium-android7.py"
          cp tools/dreamdisplays-android/apply-android8.py "$SRC/apply-kirazium-android8.py"

      - name: Apply Android compatibility patches
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dreamdisplays"
          python3 ./apply-kirazium-android-patches.py
          python3 ./apply-kirazium-android4.py
          python3 ./apply-kirazium-android5.py
          python3 ./apply-kirazium-android6.py
          python3 ./apply-kirazium-android7.py
          python3 ./apply-kirazium-android8.py

      - name: Build Android ARM64 native frame pipe
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK is unavailable on the runner."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}"

          NDK_ROOT="$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android21-clang"
          command -v rustup
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android21-clang"
          SRC="$RUNNER_TEMP/dreamdisplays"
          cd "$SRC/native"
          cargo build --locked --release --target aarch64-linux-android -p dreamdisplays-native

          BUNDLE="$SRC/native/build/ci-bundle/dreamdisplays-natives/linux-aarch64"
          mkdir -p "$BUNDLE"
          cp target/aarch64-linux-android/release/libdreamdisplays_native.so "$BUNDLE/libdreamdisplays_native.so"
          test -s "$BUNDLE/libdreamdisplays_native.so"
          "$TOOLCHAIN/llvm-readelf" -h "$BUNDLE/libdreamdisplays_native.so" | grep -q 'AArch64'
          chmod +x "$SRC/gradlew"

      - name: Preflight Dream Displays Android8 patches
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dreamdisplays"
          test "$(cat versions/active.txt)" = "26.1.2"
          test -f versions/26.1.2/gradle.properties
          test -f media/player/src/main/kotlin/com/dreamdisplays/media/player/process/FFmpegBinary.kt
          test -f media/player/src/main/kotlin/com/dreamdisplays/media/player/process/HwAccelBackend.kt
          test -f media/player/src/main/kotlin/com/dreamdisplays/media/player/pipeline/AndroidOpenALLine.kt
          test -f platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/render/AsyncTextureUploader.kt
          test -s native/build/ci-bundle/dreamdisplays-natives/linux-aarch64/libdreamdisplays_native.so
          grep -q "POJAV_FFMPEG_PATH" media/player/src/main/kotlin/com/dreamdisplays/media/player/process/FFmpegBinary.kt
          grep -q "LD_LIBRARY_PATH" media/player/src/main/kotlin/com/dreamdisplays/media/player/process/FFmpegBinary.kt
          grep -q "FFmpegBinary.processBuilder" media/player/src/main/kotlin/com/dreamdisplays/media/player/process/MediaProcess.kt
          grep -q 'MEDIACODEC("mediacodec"' media/player/src/main/kotlin/com/dreamdisplays/media/player/process/HwAccelBackend.kt
          grep -Fq 'System.getenv("POJAV_FFMPEG_PATH")?.isNotBlank() == true -> NONE' media/player/src/main/kotlin/com/dreamdisplays/media/player/process/HwAccelBackend.kt
          grep -q "AndroidOpenALLine" media/player/src/main/kotlin/com/dreamdisplays/media/player/pipeline/AudioSink.kt
          grep -q "EXTThreadLocalContext" media/player/src/main/kotlin/com/dreamdisplays/media/player/pipeline/AndroidOpenALLine.kt
          grep -q "alcSetThreadContext" media/player/src/main/kotlin/com/dreamdisplays/media/player/pipeline/AndroidOpenALLine.kt
          grep -q "reclaimProcessed()" media/player/src/main/kotlin/com/dreamdisplays/media/player/pipeline/AndroidOpenALLine.kt
          grep -q "thread-local context" media/player/src/main/kotlin/com/dreamdisplays/media/player/pipeline/AudioSink.kt
          grep -q "lwjgl-openal:3.4.1" media/player/build.gradle.kts
          grep -q "POJAV_FFMPEG_PATH" platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/render/RenderBackendCompat.kt
          grep -q "MOD_ANDROID_RUNTIME" media/player/src/main/kotlin/com/dreamdisplays/media/player/nativebridge/NativeMedia.kt
          grep -q "Using Android FFmpeg library directory" native/src/session.rs
          grep -q "version=1.9.5-kirazium-android8" gradle.properties

      - name: Build Fabric 26.1.2 Android8 mod
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dreamdisplays"
          ./gradlew :platform:client:fabric:publishJar \
            -Pdreamdisplays.autoBuildNatives=false \
            --no-daemon \
            --stacktrace

      - name: Collect patched mod
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dreamdisplays"
          mkdir -p out
          JAR="$SRC/build/libs/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android8.jar"
          if [[ ! -s "$JAR" ]]; then
            echo "Expected Android8 JAR not found. Available build outputs:"
            find "$SRC/build/libs" -maxdepth 1 -type f -name '*.jar' -print || true
            exit 1
          fi
          jar tf "$JAR" | grep -q 'dreamdisplays-natives/linux-aarch64/libdreamdisplays_native.so'
          cp "$JAR" out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android8.jar
          sha256sum out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android8.jar > out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android8.jar.sha256

      - name: Upload Android-patched Dream Displays
        uses: actions/upload-artifact@v4
        with:
          name: Kirazium-DreamDisplays-Android-26.1.2
          path: out/*
          if-no-files-found: error
          retention-days: 7
