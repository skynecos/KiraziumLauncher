name: Kirazium Dream Displays Android Mod

on:
  push:
    branches:
      - codex/dreamdisplays-ffmpeg
    paths:
      - ".github/workflows/dreamdisplays-android.yml"
      - "tools/dreamdisplays-android/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DREAMDISPLAYS_UPSTREAM_COMMIT: "bb5e1457bd4717561d367b329440e507878748e1"

jobs:
  build-fabric-26-1-2:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Kirazium patch files
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Fetch Dream Displays 1.9.5 source
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dreamdisplays"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/arnodoelinger/dreamdisplays.git
          git -C "$SRC" fetch --depth 1 origin "$DREAMDISPLAYS_UPSTREAM_COMMIT"
          git -C "$SRC" checkout --detach FETCH_HEAD
          cp tools/dreamdisplays-android/apply-patches.py "$SRC/apply-kirazium-android-patches.py"
          cp tools/dreamdisplays-android/apply-android4.py "$SRC/apply-kirazium-android4.py"

      - name: Apply Android compatibility patches
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dreamdisplays"
          python3 ./apply-kirazium-android-patches.py
          python3 ./apply-kirazium-android4.py
          chmod +x ./gradlew

      - name: Preflight Dream Displays Android4 patches
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dreamdisplays"
          test "$(cat versions/active.txt)" = "26.1.2"
          test -f versions/26.1.2/gradle.properties
          test -f media/player/src/main/kotlin/com/dreamdisplays/media/player/process/FFmpegBinary.kt
          test -f media/player/src/main/kotlin/com/dreamdisplays/media/player/process/HwAccelBackend.kt
          test -f media/player/src/main/kotlin/com/dreamdisplays/media/player/pipeline/AndroidOpenALLine.kt
          test -f platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/render/AsyncTextureUploader.kt
          grep -q "POJAV_FFMPEG_PATH" media/player/src/main/kotlin/com/dreamdisplays/media/player/process/FFmpegBinary.kt
          grep -q "LD_LIBRARY_PATH" media/player/src/main/kotlin/com/dreamdisplays/media/player/process/FFmpegBinary.kt
          grep -q "FFmpegBinary.processBuilder" media/player/src/main/kotlin/com/dreamdisplays/media/player/process/MediaProcess.kt
          grep -q 'MEDIACODEC("mediacodec"' media/player/src/main/kotlin/com/dreamdisplays/media/player/process/HwAccelBackend.kt
          grep -q "AndroidOpenALLine" media/player/src/main/kotlin/com/dreamdisplays/media/player/pipeline/AudioSink.kt
          grep -q "lwjgl-openal:3.4.1" media/player/build.gradle.kts
          grep -q "POJAV_FFMPEG_PATH" platform/client/common/src/main/kotlin/com/dreamdisplays/platform/client/render/RenderBackendCompat.kt
          grep -q "version=1.9.5-kirazium-android4" gradle.properties

      - name: Build Fabric 26.1.2 Android4 mod
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dreamdisplays"
          ./gradlew :platform:client:fabric:publishJar \
            -Pdreamdisplays.autoBuildNatives=false \
            --no-daemon \
            --stacktrace

      - name: Collect patched mod
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dreamdisplays"
          mkdir -p out
          JAR="$SRC/build/libs/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android4.jar"
          if [[ ! -s "$JAR" ]]; then
            echo "Expected Android4 JAR not found. Available build outputs:"
            find "$SRC/build/libs" -maxdepth 1 -type f -name '*.jar' -print || true
            exit 1
          fi
          cp "$JAR" out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android4.jar
          sha256sum out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android4.jar > out/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android4.jar.sha256

      - name: Upload Android-patched Dream Displays
        uses: actions/upload-artifact@v4
        with:
          name: Kirazium-DreamDisplays-Android-26.1.2
          path: out/*
          if-no-files-found: error
          retention-days: 7
