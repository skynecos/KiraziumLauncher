name: Kirazium APK

on:
  push:
    branches:
      - v3_openjdk
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get LTW renderer
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullDebug --stacktrace
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/KiraziumLauncher.apk

      - name: Upload Kirazium Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: KiraziumLauncher-APK
          path: out/KiraziumLauncher.apk
          if-no-files-found: error
