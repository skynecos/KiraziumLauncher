name: Kirazium APK

on:
  push:
    branches:
      - v3_openjdk
      - "codex/**"
  workflow_dispatch:

# Default to read-only. The release job gets write access explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Get LTW renderer
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build unsigned release APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullRelease --stacktrace

      - name: Prepare private Kirazium signing key
        env:
          KIRAZIUM_KEYSTORE_B64: ${{ secrets.KIRAZIUM_KEYSTORE_B64 }}
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KIRAZIUM_KEYSTORE_B64:-}" ] || [ -z "${KIRAZIUM_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Kirazium release signing secrets are missing. Add KIRAZIUM_KEYSTORE_B64 and KIRAZIUM_KEYSTORE_PASSWORD."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/kirazium-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          printf '%s' "$KIRAZIUM_KEYSTORE_B64" | base64 --decode > "$SIGNING_DIR/kirazium-release.jks"
          chmod 600 "$SIGNING_DIR/kirazium-release.jks"

          if [ ! -s "$SIGNING_DIR/kirazium-release.jks" ]; then
            echo "::error::Decoded Kirazium keystore is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$SIGNING_DIR/kirazium-release.jks" \
            -storepass "$KIRAZIUM_KEYSTORE_PASSWORD" \
            -alias kirazium >/dev/null

      - name: Sign and verify production APK
        env:
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is unavailable."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          UNSIGNED_APK="$(find app_pojavlauncher/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned fullRelease APK was not produced."
            exit 1
          fi

          mkdir -p out
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/kirazium-signing/kirazium-release.jks" \
            --ks-key-alias kirazium \
            --ks-pass env:KIRAZIUM_KEYSTORE_PASSWORD \
            --key-pass env:KIRAZIUM_KEYSTORE_PASSWORD \
            --out out/KiraziumLauncher.apk \
            "$UNSIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs out/KiraziumLauncher.apk
          cd out
          sha512sum KiraziumLauncher.apk > KiraziumLauncher.apk.sha512
          sha512sum -c KiraziumLauncher.apk.sha512

      - name: Upload signed Kirazium artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KiraziumLauncher-Release
          path: |
            out/KiraziumLauncher.apk
            out/KiraziumLauncher.apk.sha512
          if-no-files-found: error
          retention-days: 14

      - name: Remove private signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/kirazium-signing"

  publish:
    if: github.ref == 'refs/heads/v3_openjdk'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: KiraziumLauncher-Release
          path: out

      - name: Verify checksum before publishing
        run: |
          set -euo pipefail
          cd out
          sha512sum -c KiraziumLauncher.apk.sha512

      - name: Publish automatic signed update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          TITLE="Kirazium Launcher 1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            out/KiraziumLauncher.apk \
            out/KiraziumLauncher.apk.sha512 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "İmzalı Kirazium Launcher güncellemesi. Build #${GITHUB_RUN_NUMBER}. APK SHA-512 dosyası release ile birlikte doğrulanabilir."
