name: Kirazium APK

on:
  push:
    branches:
      - v3_openjdk
      - "codex/**"
  workflow_dispatch:
    inputs:
      publish_signed_release:
        description: "Private Kirazium anahtarıyla imzala ve GitHub Release yayınla"
        required: true
        default: false
        type: boolean

# Push CI is read-only. Only the explicitly requested signed-release job gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Get LTW renderer
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          commit: 3aca75d9f3f05afd0b02a3d8f686084d968fa200
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build unsigned release APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullRelease --stacktrace

      - name: Upload unsigned CI APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KiraziumLauncher-Unsigned-CI
          path: app_pojavlauncher/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 3

  signed_release:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/v3_openjdk' &&
       inputs.publish_signed_release == true) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/v3_openjdk' &&
       github.actor == 'skynecos' &&
       github.event.head_commit.message == 'Publish Kirazium Launcher 2.0')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_KIRAZIUM_CERT_SHA256: "206d0a623973d12b6f50f147d6e9417c164f3b66a30ce1f418c34940e94bb755"
      EXPECTED_KIRAZIUM_KEYSTORE_SHA256: "c28442da2dbbc2b49df476077f5959b7970c3116b71e7929835dec39a9df93f5"

    steps:
      - name: Download unsigned APK from verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: KiraziumLauncher-Unsigned-CI
          path: unsigned

      - name: Prepare and verify private Kirazium signing key
        env:
          KIRAZIUM_KEYSTORE_B64: ${{ secrets.KIRAZIUM_KEYSTORE_B64 }}
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KIRAZIUM_KEYSTORE_B64:-}" ] || [ -z "${KIRAZIUM_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Kirazium release signing secrets are missing."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/kirazium-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"

          NORMALIZED_KEYSTORE_B64="$(printf '%s' "$KIRAZIUM_KEYSTORE_B64" | tr -d '[:space:]')"
          if ! printf '%s' "$NORMALIZED_KEYSTORE_B64" | base64 --decode > "$SIGNING_DIR/kirazium-release.jks"; then
            echo "::error::KIRAZIUM_KEYSTORE_B64 is not valid Base64. Copy the complete kirazium-release.jks.b64 content into the secret."
            exit 1
          fi
          chmod 600 "$SIGNING_DIR/kirazium-release.jks"

          if [ ! -s "$SIGNING_DIR/kirazium-release.jks" ]; then
            echo "::error::Decoded Kirazium keystore is empty."
            exit 1
          fi

          ACTUAL_KEYSTORE_SHA256="$(sha256sum "$SIGNING_DIR/kirazium-release.jks" | awk '{print $1}')"
          if [ "$ACTUAL_KEYSTORE_SHA256" != "$EXPECTED_KIRAZIUM_KEYSTORE_SHA256" ]; then
            echo "::error::KIRAZIUM_KEYSTORE_B64 does not match the Kirazium production keystore backup."
            exit 1
          fi

          SIGNING_PASSWORD="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          if ! KEYTOOL_OUTPUT="$(keytool -list -v \
            -keystore "$SIGNING_DIR/kirazium-release.jks" \
            -storepass "$SIGNING_PASSWORD" \
            -alias kirazium 2>/dev/null)"; then
            echo "::error::KIRAZIUM_KEYSTORE_PASSWORD does not unlock the Kirazium production keystore."
            exit 1
          fi

          ACTUAL_CERT_SHA256="$(printf '%s\n' "$KEYTOOL_OUTPUT" \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"

          if [ -z "$ACTUAL_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_KIRAZIUM_CERT_SHA256" ]; then
            echo "::error::Signing keystore certificate does not match the pinned Kirazium production certificate."
            exit 1
          fi

      - name: Set up JDK 17 for apksigner tooling
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Sign and verify production APK
        env:
          KIRAZIUM_KEYSTORE_PASSWORD: ${{ secrets.KIRAZIUM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is unavailable."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          UNSIGNED_APK="$(find unsigned -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned fullRelease APK was not downloaded."
            exit 1
          fi

          SIGNING_PASSWORD="$(printf '%s' "$KIRAZIUM_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export KIRAZIUM_SIGNING_PASSWORD="$SIGNING_PASSWORD"

          mkdir -p out
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/kirazium-signing/kirazium-release.jks" \
            --ks-key-alias kirazium \
            --ks-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --key-pass env:KIRAZIUM_SIGNING_PASSWORD \
            --out out/KiraziumLauncher.apk \
            "$UNSIGNED_APK"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs out/KiraziumLauncher.apk)"
          printf '%s\n' "$VERIFY_OUTPUT"
          SIGNED_CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" \
            | awk -F': ' '/certificate SHA-256 digest/{value=$NF; gsub(":", "", value); print tolower(value); exit}')"

          if [ -z "$SIGNED_CERT_SHA256" ] || [ "$SIGNED_CERT_SHA256" != "$EXPECTED_KIRAZIUM_CERT_SHA256" ]; then
            echo "::error::Signed APK certificate does not match the pinned Kirazium production certificate."
            exit 1
          fi

          cd out
          sha512sum KiraziumLauncher.apk > KiraziumLauncher.apk.sha512
          sha512sum -c KiraziumLauncher.apk.sha512

      - name: Publish signed Kirazium Launcher 2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.0"
          TITLE="Kirazium Launcher 2.0"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          gh release create "$TAG" \
            out/KiraziumLauncher.apk \
            out/KiraziumLauncher.apk.sha512 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes $'Kirazium Launcher 2.0\n\n- Production imzalama ve güncelleme güvenliği güçlendirildi.\n- OAuth, indirme ve dosya içe aktarma güvenliği geliştirildi.\n- Modrinth mod/texture pack yönetimi geliştirildi.\n- Klasik ve Kirazium kontrol modları ile dokunmatik ölçekleme iyileştirildi.\n- Ultra Düşük Grafik ve performans ayarları geliştirildi.\n- Çentik, çözünürlük ve mobil ekran uyumluluğu iyileştirildi.\n- Kirazium profil ve sunucu entegrasyonu güncellendi.'

      - name: Remove older GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | while IFS= read -r OLD_TAG; do
                [ -z "$OLD_TAG" ] && continue
                [ "$OLD_TAG" = "v2.0" ] && continue
                gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done

      - name: Remove private signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/kirazium-signing"
