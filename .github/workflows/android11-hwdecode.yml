name: Kirazium Android11 HW Decode Launcher

on:
  push:
    branches:
      - codex/android11-hwdecode
    paths:
      - ".github/workflows/android11-hwdecode.yml"
      - "app_pojavlauncher/src/main/jni/android_art_vm_bridge.c"
      - "app_pojavlauncher/src/main/jni/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Get LTW renderer
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          commit: 3aca75d9f3f05afd0b02a3d8f686084d968fa200
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android11 launcher APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleFullRelease --stacktrace

      - name: Verify ART JavaVM bridge
        run: |
          set -euo pipefail
          APK="$(find app_pojavlauncher/build/outputs/apk/full/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          mkdir -p verify out
          unzip -p "$APK" lib/arm64-v8a/libpojavexec.so > verify/libpojavexec.so
          test -s verify/libpojavexec.so
          readelf -Ws verify/libpojavexec.so | grep -F 'kirazium_get_android_art_vm' >/dev/null
          strings verify/libpojavexec.so | grep -F 'KIRAZIUM_ANDROID_ART_VM' >/dev/null
          strings verify/libpojavexec.so | grep -F 'Published Android ART JavaVM for DreamDisplays MediaCodec' >/dev/null
          cp "$APK" out/KiraziumLauncher-Android11-HWDecode.apk
          sha256sum out/KiraziumLauncher-Android11-HWDecode.apk > out/KiraziumLauncher-Android11-HWDecode.apk.sha256

      - name: Publish quota-safe Android11 launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/android11-launcher-stage"
          output="$RUNNER_TEMP/android11-launcher-output"
          mkdir -p "$staged"
          cp out/* "$staged/"

          git worktree add --detach "$output" "$GITHUB_SHA"
          cd "$output"
          git switch --orphan android11-hwdecode-launcher-build
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p artifacts
          cp "$staged"/* artifacts/
          printf 'source_commit=%s\nsource_branch=codex/android11-hwdecode\nworkflow=android11-art-vm-launcher\n' "$GITHUB_SHA" > artifacts/BUILD_INFO.txt
          git add artifacts
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build: Android11 hardware-decode launcher"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/android11-hwdecode-launcher-build
