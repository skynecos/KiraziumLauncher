name: Kirazium Import Exact Stallfix1 Once

on:
  push:
    branches:
      - codex/final-cinema-build
    paths:
      - .github/workflows/import-exact-stallfix1-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download and verify exact DreamDisplays stallfix1
        env:
          DREAM_JAR_URL: https://raw.githubusercontent.com/skynecos/dreamdisplays/testoptimize-build/artifacts/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar?token=CMHTPCZMTPSZMARX3RODWATKUIPJ3AA
        run: |
          set -euo pipefail
          JAR=app_pojavlauncher/src/main/assets/kirazium/mods/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar
          mkdir -p "$(dirname "$JAR")"
          curl -fL --retry 4 --connect-timeout 20 "$DREAM_JAR_URL" -o "$JAR"
          test "$(stat -c%s "$JAR")" = 23595235
          echo "918872694b9fe437b6c412dda287e717d33b654a1bf8885af0ceea0ed38caab1  $JAR" | sha256sum -c -
          unzip -tqq "$JAR"

      - name: Commit exact verified JAR
        run: |
          set -euo pipefail
          JAR=app_pojavlauncher/src/main/assets/kirazium/mods/dreamdisplays-fabric-26.1.2-1.9.5-kirazium-android-stallfix1.jar
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$JAR"
          git commit -m "final: embed exact verified DreamDisplays stallfix1"
          git push origin HEAD:codex/final-cinema-build
